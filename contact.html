<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us | Avanthi Institute of Engineering &amp; Technology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="page-hero">
      <div class="container">
        <div class="crumbs"><a href="index.html">Home</a> / <span>Contact Us</span></div>
        <h1>Contact Us</h1>
        <p>We are working Monday to Saturday. You can visit our office during the hours below.</p>
      </div>
    </section>

    <section class="section">
      <div class="container contact-grid">
        <div style="display:grid;gap:22px">
          <div class="card reveal">
            <h3>Contact Information</h3>
            <ul class="contact-list" id="contactList"></ul>
          </div>
          <div class="card reveal">
            <h3>Office Hours</h3>
            <div class="hours">
              <div><span>Monday to Saturday</span><b>09:00 AM – 06:00 PM</b></div>
              <div><span>Sunday</span><b>Closed &amp; all official holidays</b></div>
            </div>
          </div>
        </div>
        <div class="reveal">
          <iframe class="map" title="Google Map – Avanthi Institute of Engineering & Technology, Narsipatnam"
            src="https://maps.google.com/maps?q=Avanthi%20Institute%20of%20Engineering%20and%20Technology%20Makavarapalem%20Narsipatnam&t=&z=14&ie=UTF8&iwloc=&output=embed"
            loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    (function () {
      const C = DATA.college, i = UI.icon;
      document.getElementById("contactList").innerHTML = `
        <li><span class="ci">${i("pin")}</span><div><b>Address</b>${C.contactAddress}</div></li>
        <li><span class="ci">${i("phone")}</span><div><b>For Admission</b><a href="tel:+919866664636">${C.admissionPhone}</a></div></li>
        <li><span class="ci">${i("phone")}</span><div><b>For Others</b><a href="tel:+9108933226739">${C.otherPhone}</a></div></li>
        <li><span class="ci">${i("mail")}</span><div><b>E-Mail</b><a href="mailto:${C.email}">${C.email}</a></div></li>
        <li><span class="ci">${i("file")}</span><div><b>Fax</b>${C.fax}</div></li>`;
    })();
  </script>
</body>
</html>
