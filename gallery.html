<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery &amp; Events | Avanthi Institute of Engineering &amp; Technology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <div id="site-header"></div>

  <main>
    <section class="page-hero" style="--bg-img:url('https://avanthienggcollege.ac.in/assets/images/page26/1.jpeg')">
      <div class="container">
        <div class="crumbs"><a href="index.html">Home</a> / <span>Gallery</span></div>
        <h1>Events &amp; Gallery</h1>
        <p>Celebrations, technical meets, awareness programmes and campus life at Avanthi. Click any photo to open the full event album.</p>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head row">
          <label class="board-search" style="min-width:min(380px,100%)">
            <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="gSearch" type="search" placeholder="Search events e.g. Induction, Yoga, NCC…" aria-label="Search events">
          </label>
          <a class="btn btn-outline" href="https://avanthienggcollege.ac.in/photo_gallery" target="_blank" rel="noopener">Full photo gallery</a>
        </div>
        <div class="masonry" id="masonry"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/layout.js"></script>
  <script>
    (function () {
      const { esc, attrs } = UI;
      const m = document.getElementById("masonry");
      const render = (term = "") => {
        const t = term.toLowerCase();
        const items = DATA.events.filter(([, title]) => title.toLowerCase().includes(t));
        m.innerHTML = items.length
          ? items.map(([img, title, href]) => `<a href="${href}"${attrs(href)}><img src="${img}" alt="${esc(title)}" loading="lazy"><span>${esc(title)}</span></a>`).join("")
          : '<p style="color:var(--muted)">No events found.</p>';
      };
      document.getElementById("gSearch").addEventListener("input", (e) => render(e.target.value));
      render();
    })();
  </script>
</body>
</html>
